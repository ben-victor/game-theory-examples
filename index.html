<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      color: var(--accent);
      margin-bottom: 2rem;
    }
   h1 a {
  	color: inherit; /* Keeps the same text color as the h1 */
	  text-decoration: underline; /* Ensures the underline is visible */
   }

  h1 a:hover {
  	text-decoration-thickness: 2px; /* Makes underline thicker on hover */
  }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 800px;
    }
    .game-card {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      border: 1px solid #334155;
      transition: transform 0.2s, border-color 0.2s;
    }
    .game-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }
    .game-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }
    .game-desc {
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <h1>Games from the textbook "Game Theory through Examples"<br>
By Erich Prisner, MAA (2012), Original website: <a href="http://eprisner.de/MAT109/MAT109.html">eprisner.de</a></h1>

  <div class="games-grid">
    
    <!-- Quatro-Uno Link -->
    <a href="./quatro-uno/" class="game-card">
      <div class="game-title">Quatro-Uno</div>
      <div class="game-desc">A game theory card elimination game based on rules by Prof. Erich Prisner.</div>
    </a>

    <!-- Add future games below by linking to their folder names -->

      <div class="game-title">Snake</div>
      <div class="game-desc">Classic arcade snake game.</div>
    </a> 
    -->

  </div>

</body>
</html>
